name: Publicar en GitHub Pages

# Construye el modelo con Vite y lo publica en GitHub Pages.
#
# Requiere Settings > Pages > Build and deployment > Source: GitHub Actions.
# Con «Deploy from a branch», GitHub lanza además su propia publicación con
# Jekyll, que sube el código sin construir y compite con este flujo.
#
# Solo publica main: cada push a main (por ejemplo, al fusionar una pull
# request) despliega la build, y también se puede lanzar a mano.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue cada vez; el que está en curso no se cancela, para no dejar
# Pages sirviendo una versión incompleta.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar los datos de ejemplo contra el contrato
        run: npm run validar:datos

      - name: Construir
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
